stages:
  - deploy

deploy_docker_all:
    stage: deploy
    environment: production
    script:
        - IMAGE_NAMESPACE="aiursoft"
        - IMAGE_NAME="anduinos"
        - RESOLUTE_TAG="resolute"
        - LATEST_TAG="latest"
        
        # 准备目标镜像名称
        - LOCAL_TARGET_COM_RESOLUTE="hub.aiursoft.com/$IMAGE_NAMESPACE/$IMAGE_NAME:$RESOLUTE_TAG"
        - LOCAL_TARGET_CN_RESOLUTE="hub.aiursoft.cn/$IMAGE_NAMESPACE/$IMAGE_NAME:$RESOLUTE_TAG"
        - PUBLIC_TARGET_RESOLUTE="$IMAGE_NAMESPACE/$IMAGE_NAME:$RESOLUTE_TAG"
        - LOCAL_TARGET_COM_LATEST="hub.aiursoft.com/$IMAGE_NAMESPACE/$IMAGE_NAME:$LATEST_TAG"
        - LOCAL_TARGET_CN_LATEST="hub.aiursoft.cn/$IMAGE_NAMESPACE/$IMAGE_NAME:$LATEST_TAG"
        - PUBLIC_TARGET_LATEST="$IMAGE_NAMESPACE/$IMAGE_NAME:$LATEST_TAG"
        
        # 1. 集中进行所有的登录操作
        - echo "$LOCAL_DOCKER_PASSWORD" | docker login hub.aiursoft.com -u "$LOCAL_DOCKER_USERNAME" --password-stdin
        - echo "$CN_DOCKER_PASSWORD" | docker login hub.aiursoft.cn -u "$CN_DOCKER_USERNAME" --password-stdin
        - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        
        # 2. 全程使用我们强大的全局多架构 Builder
        - docker buildx use aiur-global-builder
        
        - echo "Building and pushing multi-arch to all registries..."
        - |
            docker buildx build . \
              --platform linux/amd64,linux/arm64 \
              --build-arg UBUNTU_SUITE=resolute \
              -t $LOCAL_TARGET_COM_RESOLUTE \
              -t $LOCAL_TARGET_CN_RESOLUTE \
              -t $PUBLIC_TARGET_RESOLUTE \
              -t $LOCAL_TARGET_COM_LATEST \
              -t $LOCAL_TARGET_CN_LATEST \
              -t $PUBLIC_TARGET_LATEST \
              --push
    rules:
        - if: '$CI_COMMIT_BRANCH == "master"'
          exists:
              - Dockerfile
