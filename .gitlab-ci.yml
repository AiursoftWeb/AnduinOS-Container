---
stages:
  - deploy

deploy_docker_all:
  stage: deploy
  environment: production
  script:
    - IMAGE_NAMESPACE="aiursoft"
    - IMAGE_NAME="anduinos"
    - SUPPORTED_SUITES="${SUPPORTED_SUITES:-resolute}"
    - LATEST_SUITE="${LATEST_SUITE:-resolute}"
    - |
      case " $SUPPORTED_SUITES " in
        *" $LATEST_SUITE "*) ;;
        *)
          echo "LATEST_SUITE=$LATEST_SUITE is not in" \
            "SUPPORTED_SUITES='$SUPPORTED_SUITES'" >&2
          exit 1
          ;;
      esac
    - |
      echo "$LOCAL_DOCKER_PASSWORD" \
        | docker login hub.aiursoft.com \
            -u "$LOCAL_DOCKER_USERNAME" \
            --password-stdin
    - |
      echo "$CN_DOCKER_PASSWORD" \
        | docker login hub.aiursoft.cn \
            -u "$CN_DOCKER_USERNAME" \
            --password-stdin
    - |
      echo "$DOCKER_PASSWORD" \
        | docker login \
            -u "$DOCKER_USERNAME" \
            --password-stdin
    - docker buildx use aiur-global-builder
    - 'echo "Building suites: $SUPPORTED_SUITES (latest -> $LATEST_SUITE)"'
    - |
      for SUITE in $SUPPORTED_SUITES; do
        echo "Building and pushing suite: $SUITE"
        if [ "$SUITE" = "$LATEST_SUITE" ]; then
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --build-arg UBUNTU_SUITE="$SUITE" \
            -t "hub.aiursoft.com/$IMAGE_NAMESPACE/$IMAGE_NAME:$SUITE" \
            -t "hub.aiursoft.cn/$IMAGE_NAMESPACE/$IMAGE_NAME:$SUITE" \
            -t "$IMAGE_NAMESPACE/$IMAGE_NAME:$SUITE" \
            -t "hub.aiursoft.com/$IMAGE_NAMESPACE/$IMAGE_NAME:latest" \
            -t "hub.aiursoft.cn/$IMAGE_NAMESPACE/$IMAGE_NAME:latest" \
            -t "$IMAGE_NAMESPACE/$IMAGE_NAME:latest" \
            --push
        else
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --build-arg UBUNTU_SUITE="$SUITE" \
            -t "hub.aiursoft.com/$IMAGE_NAMESPACE/$IMAGE_NAME:$SUITE" \
            -t "hub.aiursoft.cn/$IMAGE_NAMESPACE/$IMAGE_NAME:$SUITE" \
            -t "$IMAGE_NAMESPACE/$IMAGE_NAME:$SUITE" \
            --push
        fi
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      exists:
        - Dockerfile

.alertcenter_report:
    stage: .post
    inherit:
        default: false
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    dependencies: []
    resource_group: "alertcenter-$CI_COMMIT_REF_SLUG"
    timeout: 10m
    allow_failure: true
    retry:
        max: 2
        when: script_failure
    before_script:
        - |
            set +x
            test -n "${ALERTCENTER_SERVER:-}" && test -n "${ALERTCENTER_API_KEY:-}" || {
                echo "AlertCenter server or API key is not configured."
                exit 1
            }
            mkdir -p "$CI_PROJECT_DIR/.alertcenter-tools"
            cat > "$CI_PROJECT_DIR/.alertcenter-tools/nuget.config" <<'NUGETEOF'
            <configuration><packageSources><clear/><add key="aiursoft" value="https://nuget.aiursoft.com/v3/index.json"/></packageSources></configuration>
            NUGETEOF
            dotnet tool install Aiursoft.AlertCenter.Client --version 10.8.0 --tool-path "$CI_PROJECT_DIR/.alertcenter-tools" --configfile "$CI_PROJECT_DIR/.alertcenter-tools/nuget.config"
    script:
        - .alertcenter-tools/alertcenter ci report --result "$ALERTCENTER_RESULT" --server "$ALERTCENTER_SERVER" --api-key "$ALERTCENTER_API_KEY"

alertcenter_failure:
    extends: .alertcenter_report
    when: on_failure
    variables:
        ALERTCENTER_RESULT: failed

alertcenter_success:
    extends: .alertcenter_report
    when: on_success
    variables:
        ALERTCENTER_RESULT: success
